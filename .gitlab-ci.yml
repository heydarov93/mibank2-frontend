# Build Dev
build dev artifacts:
  stage: 🔨build-dev
  tags: [docker]
  image: $AND_DOCKER_PROXY_REGISTRY_NAME/node:18
  environment:
    name: development
  script:
    - echo "Installing source NPM dependencies... and building artifacts"
    - cp $REACT_ENV .env
    - CI=false && npm i --legacy-peer-deps && npm run build
  artifacts:
    paths:
      - build/
    expire_in: "1 hour"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Deploy to Development
deploy to development:
  stage: 🚀deploy-dev
  tags: [docker]
  image: $AND_DOCKER_PROXY_REGISTRY_NAME/python:latest
  environment:
    name: development
  script:
    - echo "Deploying project to $CI_ENVIRONMENT_NAME environment"
    - pip install awscli
    # Synchronization with S3
    - aws s3 sync build/ s3://$S3_PATH
    # CloudFront Cache Invalidation
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths '/*'
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

